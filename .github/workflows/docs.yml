name: API docs
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -q -DskipTests javadoc:javadoc
      - name: Collect javadoc output
        run: |
          mkdir -p site
          if [ -d target/reports/apidocs ]; then cp -r target/reports/apidocs/* site/;
          elif [ -d target/site/apidocs ]; then cp -r target/site/apidocs/* site/;
          else echo "javadoc output dir not found"; find target -name 'index.html' | head; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
